<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研發專用 PDF 批次拆分與多檔合併工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #1e1e2e;
      --panel: #2a2a3c;
      --accent: #7209b7;
      --text: #e2e8f0;
      --border: #444466;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
      overflow-y: auto;
    }
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--panel);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    h2 { font-size: 1.2rem; color: #f72585; margin-bottom: 12px; }
    label { font-size: 0.9rem; display: block; margin-top: 10px; color: #4cc9f0; }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #120e16;
      color: #fff;
      font-size: 0.95rem;
    }
    .drop-zone {
      border: 2px dashed #7209b7;
      padding: 20px;
      text-align: center;
      border-radius: 6px;
      background: rgba(114, 9, 183, 0.1);
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, border-color 0.2s;
    }
    .drop-zone.dragover {
      background: rgba(114, 9, 183, 0.3);
      border-color: #f72585;
    }
    button {
      background: linear-gradient(135deg, #7209b7, #b5179e);
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 12px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .file-list {
      margin-top: 10px;
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #120e16;
      margin-bottom: 6px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .file-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
    .remove-btn {
      background: #d62828;
      width: auto;
      padding: 2px 8px;
      margin-top: 0;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 功能 1：安規與規格書 批次多檔拆分 -->
  <div class="card">
    <h2>✂️ 批次 PDF 拆分 (支援多檔同時下載)</h2>
    
    <div class="drop-zone" id="splitDropZone">
      📂 點擊選擇 PDF，或將安規總檔直接「拖曳拉進這裡」
      <input type="file" id="splitInput" accept="application/pdf" style="display: none;">
    </div>

    <div id="splitInfo" style="margin-top: 8px; font-size: 0.85rem; color: #e2e8f0;"></div>

    <label>批次拆分範圍 (用逗號分開，例如：1-3, 4-5, 6-8)：</label>
    <input type="text" id="pageRangesInput" placeholder="例如：1-3, 4-5 (會自動拆成 2 份獨立 PDF 檔下載)">

    <label>基礎檔名前綴：</label>
    <input type="text" id="splitPrefixName" placeholder="例如：安規證書">

    <div class="btn-group">
      <button onclick="executeBatchSplitRanges()" style="background: linear-gradient(135deg, #2a9d8f, #e76f51);">⚡ 按指定範圍拆成多檔下載</button>
      <button onclick="executeSplitEverySinglePage()" style="background: linear-gradient(135deg, #3a0ca3, #4361ee);">📄 每 1 頁獨立拆成 1 檔下載</button>
    </div>
  </div>

  <!-- 功能 2：多份 PDF 拖曳合併 -->
  <div class="card">
    <h2>📑 多份 PDF 檔案順暢合併</h2>
    
    <div class="drop-zone" id="mergeDropZone">
      📂 點擊選擇多個 PDF，或將「多份檔案同時拖曳進這裡」
      <input type="file" id="mergeInput" accept="application/pdf" multiple style="display: none;">
    </div>

    <div class="file-list" id="mergeFileList">
      <div style="text-align: center; color: #888; font-size: 0.85rem;">尚未選擇任何檔案</div>
    </div>

    <label>合併後檔案名稱：</label>
    <input type="text" id="mergedOutputName" value="合併完成發行總檔.pdf">

    <button onclick="executeMerge()" style="background: linear-gradient(135deg, #7209b7, #f72585);">🔗 合併所有 PDF 並下載</button>
  </div>

</div>

<script>
  let splitFileBytes = null;
  let splitTotalPages = 0;
  let splitOriginalFileName = "";
  let mergeFilesArray = [];

  // 1. 拆分功能：載入檔與拖曳
  const splitInput = document.getElementById('splitInput');
  const splitDropZone = document.getElementById('splitDropZone');

  splitDropZone.addEventListener('click', () => splitInput.click());
  splitInput.addEventListener('change', (e) => loadSplitFile(e.target.files[0]));

  setupDropZone(splitDropZone, (files) => {
    if (files.length > 0) loadSplitFile(files[0]);
  });

  async function loadSplitFile(file) {
    if (!file || file.type !== 'application/pdf') return alert('請選擇有效的 PDF 檔案！');
    try {
      splitOriginalFileName = file.name.replace(/\.[^/.]+$/, "");
      splitFileBytes = await file.arrayBuffer();
      const pdfDoc = await PDFLib.PDFDocument.load(splitFileBytes.slice(0));
      splitTotalPages = pdfDoc.getPageCount();
      document.getElementById('splitInfo').innerText = `📄 成功載入：「${file.name}」，總頁數：${splitTotalPages} 頁`;
      document.getElementById('splitPrefixName').value = splitOriginalFileName;
    } catch (err) {
      alert('載入 PDF 失敗：' + err.message);
    }
  }

  // 2. 批次多範圍拆分下載 (例如 1-3, 4-5)
  async function executeBatchSplitRanges() {
    if (!splitFileBytes) return alert('請先選擇或拖曳要拆分的 PDF 檔案！');
    const rangesStr = document.getElementById('pageRangesInput').value.trim();
    if (!rangesStr) return alert('請輸入拆分範圍（例如：1-3, 4-5）！');

    const prefix = document.getElementById('splitPrefixName').value.trim() || '拆分文件';
    const rangeGroups = rangesStr.split(',').map(s => s.trim()).filter(s => s.length > 0);

    try {
      const sourceDoc = await PDFLib.PDFDocument.load(splitFileBytes.slice(0));

      for (let i = 0; i < rangeGroups.length; i++) {
        const rangeText = rangeGroups[i];
        const pageIndices = parseSingleRangeText(rangeText, splitTotalPages);

        if (pageIndices.length === 0) continue;

        const newDoc = await PDFLib.PDFDocument.create();
        const copiedPages = await newDoc.copyPages(sourceDoc, pageIndices);
        copiedPages.forEach(p => newDoc.addPage(p));

        const pdfBytes = await newDoc.save();
        const filename = `${prefix}_Part${i + 1}_(頁${rangeText}).pdf`;
        
        // 微小延遲避免瀏覽器阻擋連續多檔下載
        await delay(i * 300);
        downloadFile(pdfBytes, filename);
      }
    } catch (err) {
      alert('批次拆分失敗：' + err.message);
    }
  }

  // 3. 每 1 頁獨立拆成 1 檔連發下載
  async function executeSplitEverySinglePage() {
    if (!splitFileBytes) return alert('請先選擇或拖曳要拆分的 PDF 檔案！');
    if (!confirm(`確定要把全部 ${splitTotalPages} 頁，拆編成 ${splitTotalPages} 個獨立 PDF 檔同時下載嗎？`)) return;

    const prefix = document.getElementById('splitPrefixName').value.trim() || '單頁';

    try {
      const sourceDoc = await PDFLib.PDFDocument.load(splitFileBytes.slice(0));

      for (let i = 0; i < splitTotalPages; i++) {
        const newDoc = await PDFLib.PDFDocument.create();
        const [copiedPage] = await newDoc.copyPages(sourceDoc, [i]);
        newDoc.addPage(copiedPage);

        const pdfBytes = await newDoc.save();
        const filename = `${prefix}_第${i + 1}頁.pdf`;

        await delay(i * 250);
        downloadFile(pdfBytes, filename);
      }
    } catch (err) {
      alert('單頁拆分失敗：' + err.message);
    }
  }

  // 4. 合併功能：選擇多檔與拖曳
  const mergeInput = document.getElementById('mergeInput');
  const mergeDropZone = document.getElementById('mergeDropZone');

  mergeDropZone.addEventListener('click', () => mergeInput.click());
  mergeInput.addEventListener('change', (e) => addMergeFiles(Array.from(e.target.files)));

  setupDropZone(mergeDropZone, (files) => {
    if (files.length > 0) addMergeFiles(Array.from(files));
  });

  function addMergeFiles(files) {
    files.forEach(file => {
      if (file.type === 'application/pdf') mergeFilesArray.push(file);
    });
    renderMergeFileList();
  }

  function renderMergeFileList() {
    const container = document.getElementById('mergeFileList');
    container.innerHTML = '';

    if (mergeFilesArray.length === 0) {
      container.innerHTML = '<div style="text-align: center; color: #888; font-size: 0.85rem;">尚未選擇任何檔案</div>';
      return;
    }

    mergeFilesArray.forEach((file, index) => {
      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `
        <span>${index + 1}. ${file.name}</span>
        <button class="remove-btn" onclick="removeMergeFile(${index})">移除</button>
      `;
      container.appendChild(item);
    });
  }

  function removeMergeFile(index) {
    mergeFilesArray.splice(index, 1);
    renderMergeFileList();
  }

  async function executeMerge() {
    if (mergeFilesArray.length < 2) return alert('請至少選擇 2 個 PDF 檔案進行合併！');

    try {
      const mergedPdf = await PDFLib.PDFDocument.create();

      for (let file of mergeFilesArray) {
        const fileBytes = await file.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(fileBytes.slice(0));
        const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
        copiedPages.forEach(page => mergedPdf.addPage(page));
      }

      const pdfBytes = await mergedPdf.save();
      let outputName = document.getElementById('mergedOutputName').value.trim() || '合併完成.pdf';
      if (!outputName.endsWith('.pdf')) outputName += '.pdf';

      downloadFile(pdfBytes, outputName);
    } catch (err) {
      alert('合併 PDF 失敗：' + err.message);
    }
  }

  // 通用拖曳註冊邏輯
  function setupDropZone(dropZoneEl, callback) {
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZoneEl.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
    });
    dropZoneEl.addEventListener('dragover', () => dropZoneEl.classList.add('dragover'), false);
    dropZoneEl.addEventListener('dragleave', () => dropZoneEl.classList.remove('dragover'), false);
    dropZoneEl.addEventListener('drop', (e) => {
      dropZoneEl.classList.remove('dragover');
      callback(e.dataTransfer.files);
    }, false);
  }

  // 解析單組範圍字串 (如 "1-3" 或 "5")
  function parseSingleRangeText(rangeText, totalPages) {
    const pages = new Set();
    if (rangeText.includes('-')) {
      const [start, end] = rangeText.split('-').map(n => parseInt(n.trim(), 10));
      if (!isNaN(start) && !isNaN(end)) {
        for (let i = Math.max(1, start); i <= Math.min(totalPages, end); i++) {
          pages.add(i - 1);
        }
      }
    } else {
      const pageNum = parseInt(rangeText, 10);
      if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= totalPages) {
        pages.add(pageNum - 1);
      }
    }
    return Array.from(pages).sort((a, b) => a - b);
  }

  function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

  function downloadFile(bytes, filename) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }
</script>

</body>
</html>
