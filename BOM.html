<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOM 料號全自動展開與計數工具</title>
  <style>
    body {
      background-color: #120e16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      max-width: 650px;
      margin: 0 auto;
    }
    .box {
      background: #1c1625;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(181, 23, 158, 0.4);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      color: #f72585;
      font-size: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      color: #4cc9f0;
    }
    textarea {
      width: 100%;
      background: rgba(15, 12, 22, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 16px;
      box-sizing: border-box;
      resize: vertical;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    button {
      flex: 1;
      background: linear-gradient(135deg, #7209b7, #b5179e);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.8;
    }
    .copy-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .counter-badge {
      display: inline-block;
      background: #7209b7;
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      margin-left: 8px;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>⚡ BOM 料號萬能展開工具</h2>
  
  <label for="rangeInput">輸入料號（支援頓號、逗號加空格、多行貼上）：</label>
  <textarea id="rangeInput" rows="5" placeholder="可直接貼上，例如：&#10;R18, R19, R21~R24, R32&#10;RA1~RA8 、 C7 、 C8"></textarea>

  <div class="btn-group">
    <button onclick="processExpand()">🚀 開始展開（無空格）</button>
    <button class="copy-btn" onclick="copyResult()">📋 複製結果</button>
  </div>

  <div class="output-header">
    <label for="resultOutput" style="margin:0;">轉換結果：</label>
    <div>
      <span style="color: #bbb; font-size: 14px;">總數量：</span>
      <span id="partCountBadge" class="counter-badge">0 顆</span>
    </div>
  </div>
  <textarea id="resultOutput" rows="5" readonly placeholder="轉換後的料號會顯示在這裡..."></textarea>
</div>

<script>
  function expandComplexRange(inputText) {
    if (!inputText) return { result: "", count: 0 };

    // 1. 替換全形符號，統一為半形
    const cleanText = inputText.replace(/～/g, "~").replace(/－/g, "-");
    
    // 2. 切割字串：不論是換行、頓號、逗號、半形或全形空白，通通切開
    const tokens = cleanText.split(/[\n,、\s]+/);

    let resultList = [];

    tokens.forEach(token => {
      // 徹底清除前後與內部的所有空白
      token = token.replace(/\s+/g, "");
      if (!token) return;

      // 3. 正則比對：支援多字母開頭（如 RA, CN）與範圍（~ 或 -）
      const rangeMatch = token.match(/^([A-Za-z]+)(\d+)[~-]([A-Za-z]+)?(\d+)$/);

      if (rangeMatch) {
        const prefix = rangeMatch[1];
        const startNum = parseInt(rangeMatch[2], 10);
        const endNum = parseInt(rangeMatch[4], 10);

        if (startNum <= endNum) {
          for (let i = startNum; i <= endNum; i++) {
            resultList.push(prefix + i);
          }
        } else {
          resultList.push(token);
        }
      } else {
        // 單一料號直接加入
        resultList.push(token);
      }
    });

    return {
      result: resultList.join(","), // 逗號連接，完全無空格
      count: resultList.length
    };
  }

  function processExpand() {
    const inputVal = document.getElementById('rangeInput').value;
    const outputArea = document.getElementById('resultOutput');
    const badge = document.getElementById('partCountBadge');

    const { result, count } = expandComplexRange(inputVal);

    outputArea.value = result;
    badge.innerText = count + " 顆";
  }

  function copyResult() {
    const outputArea = document.getElementById('resultOutput');
    if (!outputArea.value) return;
    outputArea.select();
    document.execCommand('copy');
    alert('已成功複製到剪貼簿！（完全無空格）');
  }
</script>

</body>
</html>
