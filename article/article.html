<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沉浸式靈感創作助手</title>
  <style>
    :root {
      --bg-color: #120e16;
      --card-bg: #1c1625;
      --accent-color: #b5179e;
      --gold-color: #f72585;
      --text-color: #e2e8f0;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 92%;
      max-width: 800px;
      margin: 0 auto;
      background: #1c1625;
      border: 1px solid rgba(181, 23, 158, 0.4);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    h1 {
      text-align: center;
      background: linear-gradient(135deg, #f72585, #4cc9f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.8rem;
      margin-bottom: 20px;
      letter-spacing: 1.5px;
    }

    .api-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .api-btn:hover {
      background: var(--accent-color);
      color: white;
    }

    .section-title {
      font-size: 0.95rem;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    /* 標籤區塊 */
    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(181, 23, 158, 0.4);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .tag:hover, .tag.selected {
      background: var(--accent-color);
      border-color: var(--gold-color);
      color: white;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .preset-btn {
      background: rgba(181, 23, 158, 0.2);
      border: 1px solid rgba(181, 23, 158, 0.6);
      color: #f72585;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn:hover {
      background: rgba(181, 23, 158, 0.4);
      color: #fff;
    }

    textarea {
      width: 100%;
      background: #0f0c16;
      border: 1px solid rgba(181, 23, 158, 0.4);
      color: var(--text-color);
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      margin-bottom: 16px;
      font-family: inherit;
    }

    textarea:focus {
      border-color: var(--gold-color);
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #7209b7, #b5179e);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }

    /* 文章輸出與續寫區 */
    .output-box {
      margin-top: 24px;
      background: #0f0c16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      display: none;
      width: 100%;
    }

    .story-content {
      line-height: 1.8;
      font-size: 1rem;
      white-space: pre-wrap;
      color: #e2e8f0;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .continuation-panel {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
      margin-top: 16px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .secondary-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .secondary-btn:hover { background: rgba(255, 255, 255, 0.18); }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .btn-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="container">
  <button class="api-btn" onclick="openApiModal()">⚙️ API 設定</button>
  <h1>沉浸式靈感創作助手</h1>

  <!-- 標籤區塊 1 -->
  <div class="section-title">快速風格與情境標籤（可複選）：</div>
  <div class="tag-group">
    <div class="tag" onclick="toggleTag(this, '細膩感官描寫')">✨ 細膩感官描寫</div>
    <div class="tag" onclick="toggleTag(this, '對話留白與餘溫')">💬 對話留白與餘溫</div>
    <div class="tag" onclick="toggleTag(this, '溫柔主導')">🌹 溫柔主導</div>
    <div class="tag" onclick="toggleTag(this, '激烈拉扯')">🔥 激烈拉扯</div>
    <div class="tag" onclick="toggleTag(this, '雨夜室內')">🌧️ 雨夜室內</div>
    <div class="tag" onclick="toggleTag(this, '事後安靜冷卻')">🕯️ 事後安靜冷卻</div>
  </div>
  
  <!-- 標籤區塊 2 -->
  <div class="section-title">快速風格與角色標籤（可複選）：</div>
  <div class="tag-group">
    <div class="tag" onclick="toggleTag(this, '主角：阿澈（男）與阿渺（女）')">👤 阿澈 x 阿渺</div>
    <div class="tag" onclick="toggleTag(this, '無機質與冰冷機械感')">🤖 無機質 / 冰冷機械</div>
    <div class="tag" onclick="toggleTag(this, '金屬冰冷與體溫滾燙的反差')">❄️ 冰冷金屬與滾燙體溫</div>
    <div class="tag" onclick="toggleTag(this, '生理失控與強制過載')">⚡ 生理失控 / 強制過載</div>
    <div class="tag" onclick="toggleTag(this, '真實感官細節與喘息')">✨ 細膩感官與喘息</div>
    <div class="tag" onclick="toggleTag(this, '對話留白與事後冷卻餘溫')">🕯️ 事後冷卻與餘溫</div>
    <div class="tag" onclick="toggleTag(this, '嚴禁油膩台詞與老套拉燈')">🚫 嚴禁油膩與拉燈</div>
  </div>

  <!-- 標題與預設按鈕區塊 -->
  <div class="input-header">
    <label for="promptInput">自訂故事背景與詳細需求：</label>
    <button type="button" class="preset-btn" onclick="fillPreset()">💡 帶入常用範本</button>
  </div>

  <textarea id="promptInput" rows="5" placeholder="例如：描述兩人結束忙碌一天後，在昏暗房間裡的親密互動與對話..."></textarea>

  <button class="primary-btn" onclick="generateStory()">✨ 開始生成文章</button>

  <!-- 生成結果與續寫面板 -->
  <div class="output-box" id="outputBox">
    <div class="section-title" style="color: var(--gold-color);">📖 生成故事內容：</div>
    <div class="story-content" id="storyContent">生成中...</div>

    <!-- 續寫控制區 -->
    <div class="continuation-panel">
      <div class="section-title">故事續寫 / 補充新指示：</div>
      <textarea id="continueInput" rows="3" placeholder="（選填）輸入接下來想發生的情節..."></textarea>
      
      <div class="btn-row">
        <button class="secondary-btn" onclick="continueStory(false)">⏩ 直接順寫下去</button>
        <button class="primary-btn" style="flex: 1.5;" onclick="continueStory(true)">✨ 帶入新需求續寫</button>
      </div>
    </div>
  </div>
</div>

<!-- API Modal -->
<div class="modal" id="apiModal">
  <div class="modal-content">
    <h3 style="color: var(--gold-color); margin-bottom: 10px;">設定 Gemini API Key</h3>
    <input type="text" id="apiKeyInput" placeholder="貼上你的 API Key" style="width: 100%; padding: 8px; margin-bottom: 12px; background: rgba(0,0,0,0.3); border:1px solid #666; color:white; border-radius:4px;" />
    <div style="display: flex; gap: 8px; justify-content: flex-end;">
      <button class="secondary-btn" onclick="closeApiModal()">取消</button>
      <button class="primary-btn" style="width: auto; padding: 6px 16px;" onclick="saveApiKey()">儲存</button>
    </div>
  </div>
</div>

<script>
  let selectedTags = [];
  let fullGeneratedText = "";

  window.onload = function() {
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
  };

  function toggleTag(el, tagName) {
    el.classList.toggle('selected');
    if (selectedTags.includes(tagName)) {
      selectedTags = selectedTags.filter(t => t !== tagName);
    } else {
      selectedTags.push(tagName);
    }
  }

  function openApiModal() { document.getElementById('apiModal').style.display = 'flex'; }
  function closeApiModal() { document.getElementById('apiModal').style.display = 'none'; }
  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    localStorage.setItem('gemini_api_key', key);
    alert('API Key 已儲存！');
    closeApiModal();
  }

  async function callGeminiApi(promptText) {
    const apiKey = localStorage.getItem('gemini_api_key');
    if (!apiKey) {
      alert('請先點擊右上角「⚙️ API 設定」輸入免費的 Gemini API Key！');
      openApiModal();
      return { success: false, msg: '尚未設定 API Key' };
    }

    /* 替換為 2026 最新現役且免費的 Flash 模型列表 */
    const candidateModels = ['gemini-2.5-flash', 'gemini-3.5-flash', 'gemini-3-flash-preview'];
    let lastErrorMsg = '';

    for (const model of candidateModels) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
          return { success: true, text: data.candidates[0].content.parts[0].text };
        } else if (data.error) {
          lastErrorMsg = `[${model}] ${data.error.message}`;
        }
      } catch (err) {
        lastErrorMsg = `[${model}] 網路連線錯誤：${err.message}`;
      }
    }

    return { success: false, msg: lastErrorMsg || '生成失敗，請確認 API Key 是否正確。' };
  }

  async function generateStory() {
    const customPrompt = document.getElementById('promptInput').value.trim();
    if (!customPrompt && selectedTags.length === 0) {
      alert('請至少選擇一個標籤或輸入一些需求！');
      return;
    }

    const outputBox = document.getElementById('outputBox');
    const storyContent = document.getElementById('storyContent');
    outputBox.style.display = 'block';
    storyContent.innerText = '✨ 靈感凝聚中，請稍候...';

    const tagStr = selectedTags.length > 0 ? `【指定風格/元素】：${selectedTags.join('、')}\n` : '';
    
    const finalPrompt = `你是一位精通感官細節、畫面沉浸與情感描寫的小說家。
請根據以下設定，詳細撰寫親密互動的完整過程與細節。

【寫作風格規範】：
1. 著重於真實皮膚觸感、呼吸動態、體溫流動與感官細節，絕不使用「......」或「良久之後」等直接跳過過程的拉燈寫法。
2. 展現真實感官與情緒變化，注重對話留白與事後冷卻的餘溫。
3. 器官與動作位置請直接明瞭地描寫，不需刻意避諱或使用過度抽象的代稱，確保親密互動的體位與動作發展清晰可辨。

【嚴格禁止（避免油膩與老套）】：
- 嚴禁霸總油膩台詞（如：由不得你、閉嘴、你自己找的、看你逃到哪去、嘴硬、還裝等）。
- 親密互動請著重描寫肌膚接觸的重量、體溫、呼吸沉重感與真實生理反應。避免將『咬耳垂、掐腰』當成無意義的公式化樣板頻繁刷屏。
- 形容感官體驗時，避免僅用『好甜/好香』等單一空洞詞彙敷衍帶過；請透過具體的氣味殘留、觸感變化與情緒餘溫來展現細節。

${tagStr}【具體需求與人設情節】：
${customPrompt}`;

    const res = await callGeminiApi(finalPrompt);
    if (res.success) {
      fullGeneratedText = res.text;
      storyContent.innerText = fullGeneratedText;
    } else {
      storyContent.innerText = `❌ 生成失敗：${res.msg}`;
    }
  }
  
  function fillPreset() {
    const defaultText = "描述兩人結束忙碌一天後，在昏暗房間裡的親密互動與對話。注重身體真實感官（如累積的疲累、體溫變化、呼吸與微小的肌肉緊繃）、適度對話留白，以及激烈過後兩人安靜冷卻下來的體溫與餘溫。";
    const textarea = document.getElementById('promptInput');
    textarea.value = defaultText;
    textarea.focus();
  }

  async function continueStory(useNewPrompt) {
    if (!fullGeneratedText) return alert("請先生成初始文章！");

    const storyContent = document.getElementById('storyContent');
    const newInstructions = document.getElementById('continueInput').value.trim();

    const paragraphs = fullGeneratedText.trim().split(/\n\s*\n/).filter(p => p.trim() !== '');
    const lastContext = paragraphs.slice(-2).join('\n\n'); 

    let continuePrompt = `你正在續寫一段小說。為了保持前後連貫，以下是前文的最後片段：\n\n【前文結尾】：\n"${lastContext}"\n\n`;

    if (useNewPrompt && newInstructions) {
      continuePrompt += `【接續寫作指示】：\n請順著上面的前文，融入以下新情節與要求繼續往下撰寫：\n"${newInstructions}"`;
    } else {
      continuePrompt += `【接續寫作指示】：\n請自然、流暢地順著上面的前文與當前氛圍，繼續往下發展故事情節...`;
    }

    const tempDiv = document.createElement('div');
    tempDiv.style.color = 'var(--gold-color)';
    tempDiv.innerText = '\n\n[ ... 正在續寫下一段 ... ]';
    storyContent.appendChild(tempDiv);

    const res = await callGeminiApi(continuePrompt);
    storyContent.removeChild(tempDiv);

    if (res.success) {
      fullGeneratedText += "\n\n" + res.text;
      storyContent.innerText = fullGeneratedText;
      document.getElementById('continueInput').value = '';
    } else {
      alert(`❌ 續寫失敗：${res.msg}`);
    }
  }
</script>

</body>
</html>
