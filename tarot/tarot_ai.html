<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>托特塔羅抽牌系統</title>
  <style>
    :root {
      --bg-color: #0f0c1b;
      --card-bg: #1a162b;
      --accent-color: #9d4edd;
      --gold-color: #e0a96d;
      --text-color: #e2e8f0;
      --text-dim: #a0aec0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: rgba(26, 22, 43, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(157, 78, 221, 0.3);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    h1 {
      text-align: center;
      color: var(--gold-color);
      font-size: 1.8rem;
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(224, 169, 109, 0.3);
    }

    .api-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: 1px solid var(--gold-color);
      color: var(--gold-color);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .api-btn:hover {
      background: var(--gold-color);
      color: var(--bg-color);
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: rgba(15, 12, 27, 0.6);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button.primary-btn {
      flex: 1;
      min-width: 140px;
      background: linear-gradient(135deg, #7b2cbf, #9d4edd);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button.primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
    }

    button.blind-btn {
      background: linear-gradient(135deg, #3a0ca3, #4361ee);
    }

    .custom-section {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    input[type="number"], input[type="text"], textarea {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(157, 78, 221, 0.4);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="number"]:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--gold-color);
    }

    input[type="number"] { width: 70px; }
    input[type="text"] { flex: 1; }

    .position-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 5px;
      margin-top: 10px;
    }

    /* 盲抽區域樣式 */
    .blind-container {
      display: none;
      background: rgba(15, 12, 27, 0.9);
      border: 1px dashed var(--gold-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    .blind-status {
      font-size: 1.1rem;
      color: var(--gold-color);
      margin-bottom: 16px;
      font-weight: bold;
    }

    .blind-deck {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-height: 350px;
      overflow-y: auto;
      padding: 10px;
    }

    .blind-card-back {
      width: 75px;
      height: 115px;
      background: linear-gradient(135deg, #1f1035, #3c096c);
      border: 2px solid var(--gold-color);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--gold-color);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
      user-select: none;
    }

    .blind-card-back:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 8px 20px rgba(224, 169, 109, 0.4);
      background: linear-gradient(135deg, #2a1b4e, #5a189a);
    }

    .blind-card-back.picked {
      opacity: 0.2;
      pointer-events: none;
      transform: scale(0.85);
      border-color: #555;
    }

    /* 卡牌結果樣式 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 16px;
      margin-top: 20px;
      justify-items: center;
    }

    .card-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(224, 169, 109, 0.2);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      width: 100%;
      max-width: 150px;
      transition: transform 0.3s;
    }

    .card-item:hover {
      transform: translateY(-5px);
      border-color: var(--gold-color);
      box-shadow: 0 5px 15px rgba(224, 169, 109, 0.2);
    }

    .card-position {
      font-size: 0.85rem;
      color: var(--gold-color);
      margin-bottom: 6px;
      font-weight: bold;
    }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
      background-color: #222;
    }

    .card-name {
      font-size: 0.95rem;
      font-weight: bold;
    }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .secondary-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .ai-box {
      margin-top: 30px;
      background: rgba(15, 12, 27, 0.8);
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      padding: 20px;
      display: none;
    }

    .ai-box h3 { color: var(--gold-color); margin-bottom: 10px; }

    .ai-content {
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
      color: #cbd5e1;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--gold-color);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }

    .modal-content h3 { margin-bottom: 12px; color: var(--gold-color); }
    .modal-content p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="container">
  <button class="api-btn" onclick="openApiModal()">⚙️ API 設定</button>
  <h1>托特塔羅抽牌系統</h1>

  <div class="control-panel">
    <div class="btn-group">
      <button class="primary-btn" onclick="drawFourElements()">四元素 (快速抽牌)</button>
      <button class="primary-btn blind-btn" onclick="startBlindMode('4element')">🔮 盲抽四元素</button>
    </div>

    <div class="custom-section">
      <div class="input-row">
        <label>張數：</label>
        <input type="number" id="num" value="3" min="1" max="20" onchange="generateInputs()" />
        <button class="primary-btn" style="min-width: 90px;" onclick="drawCustom()">快速抽牌</button>
        <button class="primary-btn blind-btn" style="min-width: 90px;" onclick="startBlindMode('custom')">🔮 盲抽</button>
      </div>

      <!-- 新增：求問問題 / 占卜事由 -->
      <div style="margin-bottom: 12px;">
        <div style="font-size:0.85rem; color:var(--text-dim); margin-bottom: 6px;">求問問題 / 占卜事由：</div>
        <textarea id="userQuestion" placeholder="輸入你想請教塔羅牌的問題（可不填，例如：最近工作運勢如何？或者關於某個決定的建議...）" style="width: 100%; height: 60px; resize: vertical; font-family: inherit;"></textarea>
      </div>

      <div style="font-size:0.85rem; color:var(--text-dim); margin-bottom: 6px;">位置說明設定：</div>
      <div class="position-inputs" id="inputs-container"></div>
    </div>
  </div>

  <!-- 盲抽互動區域 -->
  <div class="blind-container" id="blind-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
      <div class="blind-status" id="blind-status" style="margin-bottom: 0;">請靜心，憑直覺點擊卡牌...</div>
      <button class="secondary-btn" style="border-color: var(--gold-color); color: var(--gold-color); padding: 4px 12px; font-size: 0.85rem;" onclick="shuffleOracleCards()">🂠 重新洗牌</button>
    </div>
    <div class="blind-deck" id="blind-deck"></div>
  </div>

  <!-- 抽牌結果區域 -->
  <div id="result-area" style="display: none;">
    <div class="cards-grid" id="cards-container"></div>
    
    <div class="action-bar">
      <button class="secondary-btn" onclick="addCard()">➕ 加牌</button>
      <button class="primary-btn" style="background: linear-gradient(135deg, #d97706, #b45309);" onclick="getAiInterpretation()">✨ 請 AI 解牌</button>
    </div>

    <div class="ai-box" id="ai-box">
      <h3>✨ Gemini 托特塔羅解牌分析</h3>
      <div class="ai-content" id="ai-content">等待生成中...</div>
    </div>
  </div>
</div>

<!-- API Key Modal -->
<div class="modal" id="apiModal">
  <div class="modal-content">
    <h3>設定 Gemini API Key</h3>
    <p>API Key 將安全地儲存於您的本機瀏覽器中。</p>
    <input type="text" id="apiKeyInput" placeholder="貼上 AI Studio 金鑰" style="margin-bottom: 12px; width:100%;" />
    <div style="display: flex; gap: 8px; justify-content: flex-end;">
      <button class="secondary-btn" onclick="closeApiModal()">取消</button>
      <button class="primary-btn" style="min-width: 80px;" onclick="saveApiKey()">儲存</button>
    </div>
  </div>
</div>

<script>
  const tarot = [
    "０愚者","１魔法師","２女祭司","３皇后","４皇帝","５大祭司",
    "６戀人","７戰車","８調節","９隱者","10命運","11慾望",
    "12吊人","13死神","14藝術","15惡魔","16塔","17星星",
    "18月亮","19太陽","20新紀元","21宇宙","權杖王牌","權杖２:統御",
    "權杖３:美德","權杖４:完成","權杖５:競爭","權杖６:致勝","權杖７:勇氣","權杖８:迅捷",
    "權杖９:力量","權杖10:壓迫","權杖騎士","權杖皇后","權杖王子","權杖公主",
    "聖杯王牌","聖杯２:愛","聖杯３:豐盛","聖杯４:奢華","聖杯５:失望","聖杯６:享樂",
    "聖杯７:沉淪","聖杯８:怠惰","聖杯９:快樂","聖杯10:饜足","聖杯騎士","聖杯皇后",
    "聖杯王子","聖杯公主","寶劍王牌","寶劍２:寧靜","寶劍３:悲傷","寶劍４:休戰",
    "寶劍５:擊潰","寶劍６:科學","寶劍７:徒勞","寶劍８:阻礙","寶劍９:殘虐","寶劍10:淪亡",
    "寶劍騎士","寶劍皇后","寶劍王子","寶劍公主","圓盤王牌","圓盤２:變易",
    "圓盤３:工作","圓盤４:能力","圓盤５:憂慮","圓盤６:成功","圓盤７:失敗","圓盤８:謹慎",
    "圓盤９:獲益","圓盤10:財富","圓盤騎士","圓盤皇后","圓盤王子","圓盤公主"
  ];

  let currentDrawnCards = [];
  let blindTargetPositions = [];
  let blindShuffledPool = [];

  window.onload = function() {
    generateInputs();
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
  };

  function generateInputs() {
    const num = parseInt(document.getElementById('num').value) || 1;
    const container = document.getElementById('inputs-container');
    container.innerHTML = '';
    for (let i = 1; i <= Math.min(num, 20); i++) {
      const div = document.createElement('div');
      div.className = 'input-row';
      div.innerHTML = `<span style="font-size:0.8rem; width:50px;">第${i}張:</span><input type="text" id="no${i}" placeholder="位置名稱 (可不填)" />`;
      container.appendChild(div);
    }
  }

  function getRandomCards(count) {
    let pool = [...Array(78).keys()];
    let result = [];
    for (let i = 0; i < count; i++) {
      let randIdx = Math.floor(Math.random() * pool.length);
      result.push(pool[randIdx]);
      pool.splice(randIdx, 1);
    }
    return result;
  }

  /* 快速抽牌 */
  function drawFourElements() {
    hideBlindArea();
    const elements = ["火元素", "水元素", "風元素", "土元素"];
    const cardIndices = getRandomCards(4);
    currentDrawnCards = cardIndices.map((idx, i) => ({ pos: elements[i], cardIdx: idx, name: tarot[idx] }));
    renderCards();
  }

  function drawCustom() {
    hideBlindArea();
    const num = parseInt(document.getElementById('num').value) || 1;
    const cardIndices = getRandomCards(num);
    currentDrawnCards = [];
    for (let i = 0; i < num; i++) {
      const posLabel = document.getElementById(`no${i+1}`)?.value || `第 ${i+1} 張`;
      currentDrawnCards.push({ pos: posLabel, cardIdx: cardIndices[i], name: tarot[cardIndices[i]] });
    }
    renderCards();
  }

  /* 盲抽邏輯 */
  function startBlindMode(type) {
    document.getElementById('result-area').style.display = 'none';
    currentDrawnCards = [];

    if (type === '4element') {
      blindTargetPositions = ["火元素", "水元素", "風元素", "土元素"];
    } else {
      const num = parseInt(document.getElementById('num').value) || 1;
      blindTargetPositions = [];
      for (let i = 0; i < num; i++) {
        blindTargetPositions.push(document.getElementById(`no${i+1}`)?.value || `第 ${i+1} 張`);
      }
    }

    // 洗牌 22 張盲抽牌牆
    blindShuffledPool = getRandomCards(22);

    const blindDeck = document.getElementById('blind-deck');
    blindDeck.innerHTML = '';
    
    blindShuffledPool.forEach((cardIdx) => {
      const cardEl = document.createElement('div');
      cardEl.className = 'blind-card-back';
      cardEl.innerText = '☽';
      cardEl.onclick = () => pickBlindCard(cardEl, cardIdx);
      blindDeck.appendChild(cardEl);
    });

    updateBlindStatus();
    document.getElementById('blind-container').style.display = 'block';
  }

  function pickBlindCard(cardEl, cardIdx) {
    if (cardEl.classList.contains('picked')) return;

    const currentPos = blindTargetPositions[currentDrawnCards.length];
    cardEl.classList.add('picked');

    currentDrawnCards.push({
      pos: currentPos,
      cardIdx: cardIdx,
      name: tarot[cardIdx]
    });

    updateBlindStatus();

    // 抽滿張數
    if (currentDrawnCards.length === blindTargetPositions.length) {
      setTimeout(() => {
        hideBlindArea();
        renderCards();
      }, 300);
    }
  }

  function updateBlindStatus() {
    const remaining = blindTargetPositions.length - currentDrawnCards.length;
    const nextPos = blindTargetPositions[currentDrawnCards.length] || '';
    document.getElementById('blind-status').innerText = 
      `請點擊卡牌選擇：${nextPos} (還需選擇 ${remaining} 張)`;
  }

  function hideBlindArea() {
    document.getElementById('blind-container').style.display = 'none';
  }
  
  /* 盲抽：手動洗牌 */
  function shuffleOracleCards() {
    if (blindTargetPositions.length === 0) {
      blindTargetPositions = ["火元素", "水元素", "風元素", "土元素"];
    }

    currentDrawnCards = [];
    document.getElementById('result-area').style.display = 'none';
    document.getElementById('ai-box').style.display = 'none';

    blindShuffledPool = getRandomCards(22);

    const blindDeck = document.getElementById('blind-deck');
    const blindContainer = document.getElementById('blind-container');
    
    blindContainer.style.display = 'block';
    blindDeck.innerHTML = '<div style="width:100%; text-align:center; padding: 40px; color: var(--gold-color); font-size:1.1rem;">🂠 牌池洗牌中，請稍候...</div>';

    setTimeout(() => {
      blindDeck.innerHTML = '';
      blindShuffledPool.forEach((cardIdx) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'blind-card-back';
        cardEl.innerText = '☽';
        cardEl.onclick = () => pickBlindCard(cardEl, cardIdx);
        blindDeck.appendChild(cardEl);
      });
      updateBlindStatus();
    }, 200);
  }

  /* 加牌 */
  function addCard() {
    const drawnIndices = currentDrawnCards.map(c => c.cardIdx);
    const available = [...Array(78).keys()].filter(idx => !drawnIndices.includes(idx));
    if (available.length === 0) return alert("牌組已抽完！");

    const randIdx = available[Math.floor(Math.random() * available.length)];
    currentDrawnCards.push({
      pos: `加牌 ${currentDrawnCards.length + 1}`,
      cardIdx: randIdx,
      name: tarot[randIdx]
    });
    renderCards();
  }

  /* 渲染卡牌 */
  function renderCards() {
    const container = document.getElementById('cards-container');
    container.innerHTML = '';
    currentDrawnCards.forEach(item => {
      const cardEl = document.createElement('div');
      cardEl.className = 'card-item';
      cardEl.innerHTML = `
        <div class="card-position">${item.pos}</div>
        <img class="card-img" src="tarot_images/${item.cardIdx}.jpg" alt="${item.name}" onerror="this.src='https://via.placeholder.com/130x180/1a162b/e0a96d?text=No+Image'" />
        <div class="card-name">${item.name}</div>
      `;
      container.appendChild(cardEl);
    });

    document.getElementById('result-area').style.display = 'block';
    document.getElementById('ai-box').style.display = 'none';
  }

  /* API Modal */
  function openApiModal() { document.getElementById('apiModal').style.display = 'flex'; }
  function closeApiModal() { document.getElementById('apiModal').style.display = 'none'; }
  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    localStorage.setItem('gemini_api_key', key);
    alert('API Key 已儲存！');
    closeApiModal();
  }

  /* Gemini API 解牌 (已整合問題欄位) */
  async function getAiInterpretation() {
    const apiKey = localStorage.getItem('gemini_api_key');
    if (!apiKey) {
      alert('請先點擊右上角「⚙️ API 設定」輸入免費的 Gemini API Key！');
      openApiModal();
      return;
    }

    const aiBox = document.getElementById('ai-box');
    const aiContent = document.getElementById('ai-content');
    aiBox.style.display = 'block';
    aiContent.innerText = '正在連結 Gemini 讀取牌陣資訊，請稍候...';

    // 讀取求問問題
    const userQuestion = document.getElementById('userQuestion')?.value.trim() || '';
    let questionPrompt = userQuestion 
      ? `【求問者的問題/事由】\n"${userQuestion}"\n\n` 
      : `【求問者的問題】\n求問者未輸入具體問題，請針對當前牌陣進行整體能量盤點與指引。\n\n`;

    let cardsSummary = currentDrawnCards.map(c => `${c.pos}：${c.name}`).join('\n');
    const prompt = `你是一位精通托特塔羅（Thoth Tarot）與神秘學的資深塔羅師。請針對以下求問與抽出的牌陣進行簡潔、深刻且溫暖直白的解讀：\n\n${questionPrompt}【牌陣內容】\n${cardsSummary}\n\n請以繁體中文回應，若有具體問題請緊扣問題分析整體能量流動、核心契機與建議；若無問題則做綜合能量指引。不需要過度空洞的讚美，給予實用、具體的洞察。`;

    /* 替換為 2026 最新現役且免費的 Flash 模型列表 */
    const candidateModels = ['gemini-2.5-flash', 'gemini-3.5-flash', 'gemini-3-flash-preview'];
    let success = false;

    for (const model of candidateModels) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
          aiContent.innerText = data.candidates[0].content.parts[0].text;
          success = true;
          break; // 成功獲取結果，跳出迴圈
        }
      } catch (err) {
        console.log(`模型 ${model} 嘗試失敗，嘗試下一個...`);
      }
    }

    if (!success) {
      aiContent.innerText = '生成失敗，請確認 API Key 是否正確，或稍後再試一次。';
    }
  }
</script>

</html>
